[project]
name = "kairos-scheduler"
version = "0.1.0"
description = "Cron, interval, one-shot and watch definitions with timezone-safe next-run calculation."
requires-python = ">=3.12"
dependencies = [
    "croniter>=7,<8",
    "kairos-domain",
    "kairos-harness",
    "kairos-notify",
    "kairos-tools",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
kairos-tools = { workspace = true }
kairos-domain = { workspace = true }
kairos-harness = { workspace = true }
kairos-notify = { workspace = true }

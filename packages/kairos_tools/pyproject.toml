[project]
name = "kairos-tools"
version = "0.1.0"
description = "Built-in tools and the MCP client bridge."
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.16",
    "kairos-domain",
    "kairos-harness",
    "mcp>=2.3,<3",
    "pydantic>=2.11",
    "structlog>=25.4",
    "trafilatura>=2.3",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
kairos-domain = { workspace = true }
kairos-harness = { workspace = true }

[project]
name = "kairos-notify"
version = "0.1.0"
description = "Notification channels: email and web push."
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1,<6",
    "kairos-domain",
    "kairos-harness",
    "kairos-tools",
    "pywebpush>=2.5,<3",
    "structlog>=26.1.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
kairos-domain = { workspace = true }
kairos-harness = { workspace = true }
kairos-tools = { workspace = true }

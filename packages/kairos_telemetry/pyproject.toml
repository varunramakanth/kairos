[project]
name = "kairos-telemetry"
version = "0.1.0"
description = "OpenTelemetry setup using the GenAI semantic conventions."
requires-python = ">=3.12"
dependencies = [
    "kairos-domain",
    "opentelemetry-exporter-otlp-proto-http>=1.36",
    "opentelemetry-sdk>=1.36",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
kairos-domain = { workspace = true }
kairos-harness = { workspace = true }

[dependency-groups]
dev = [
    "kairos-harness",
]

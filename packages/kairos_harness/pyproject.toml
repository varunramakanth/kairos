[project]
name = "kairos-harness"
version = "0.1.0"
description = "The agent loop: model calls, tool dispatch, context management, hooks, budgets, checkpoints."
requires-python = ">=3.12"
dependencies = [
    "kairos-domain",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
kairos-domain = { workspace = true }

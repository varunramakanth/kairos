[project]
name = "kairos-workspace"
version = "0.1.0"
description = "Kairos: an always-on personal agent. Workspace root (not a package)."
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "pytest-socket>=0.7",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/web"]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle, pyflakes
    "I",            # import order
    "UP",           # modern syntax
    "B",            # bugbear
    "SIM",          # simplifications
    "ASYNC",        # blocking calls in async code
    "S",            # security (bandit)
    "PT",           # pytest style
    "RUF",
    "TID",          # tidy imports
    "ANN",          # annotations required
]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"tests/**" = ["S101"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["packages", "services", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests", "packages", "services"]
addopts = "-ra --strict-markers --import-mode=importlib --allow-hosts=127.0.0.1,::1,localhost --allow-unix-socket"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs local services such as Postgres (testcontainers)",
    "evals: eval suites run through kairos_evals",
    "live: talks to real external services; only runs with LIVE=1",
]

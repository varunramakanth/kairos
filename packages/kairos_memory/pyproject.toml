[project]
name = "kairos-memory"
version = "0.1.0"
description = "Long-term memory (facts, preferences, episodes) and retrieval."
requires-python = ">=3.12"
dependencies = [
    "kairos-domain",
    "kairos-harness",
    "kairos-tools",
    "fastembed>=0.9,<0.10",
    "pydantic>=2.11",
    "structlog>=25.4",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
kairos-domain = { workspace = true }
kairos-harness = { workspace = true }
kairos-tools = { workspace = true }

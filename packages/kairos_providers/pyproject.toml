[project]
name = "kairos-providers"
version = "0.1.0"
description = "Model provider adapters (Anthropic API, Amazon Bedrock) behind the harness Provider protocol."
requires-python = ">=3.12"
dependencies = [
    "anthropic[bedrock]>=2.9,<3",
    "kairos-domain",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
kairos-domain = { workspace = true }

[project]
name = "kairos-domain"
version = "0.1.0"
description = "Shared Pydantic models: messages, run events, tool schemas. Source of the OpenAPI and TypeScript types."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[project]
name = "kairos-memory"
version = "0.1.0"
description = "Long-term memory (facts, preferences, episodes) and retrieval."
requires-python = ">=3.12"
dependencies = [
    "kairos-domain",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
kairos-domain = { workspace = true }

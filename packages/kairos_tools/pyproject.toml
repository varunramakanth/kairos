[project]
name = "kairos-tools"
version = "0.1.0"
description = "Built-in tools and the MCP client bridge."
requires-python = ">=3.12"
dependencies = [
    "kairos-domain",
    "pydantic>=2.11",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
kairos-domain = { workspace = true }

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kairos is offline</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
      main { max-width: 26rem; text-align: center; }
      p { color: GrayText; line-height: 1.5; }
      button { font: inherit; padding: .5rem 1rem; border-radius: .5rem; border: 1px solid GrayText; background: transparent; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Kairos needs a connection to reach your agent. Your scheduled tasks and watches keep running on the server; this page will work again once you're back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>

[project]
name = "kairos-db"
version = "0.1.0"
description = "SQLAlchemy models, Alembic migrations and Postgres-backed stores."
requires-python = ">=3.12"
dependencies = [
    "kairos-domain",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
kairos-domain = { workspace = true }

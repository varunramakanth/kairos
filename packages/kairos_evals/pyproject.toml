[project]
name = "kairos-evals"
version = "0.2.0"
description = "Framework-agnostic agent eval library. Consumes OpenTelemetry traces; must not import other kairos_* packages."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.9,<3",
    "croniter>=7,<8",
    "pydantic>=2.11",
    "typer>=0.16",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30", "sqlalchemy[asyncio]>=2.0.40"]
s3 = ["boto3>=1.44,<2", "pyarrow>=20"]

[project.scripts]
kairos-evals = "kairos_evals.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"
